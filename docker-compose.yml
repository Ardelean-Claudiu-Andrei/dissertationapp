services:
  backend:
    build: ./admin-app/backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_NAME: dissertationapp
      DB_USER: root
      DB_PASSWORD: xxxxxx
      JWT_SECRET: dissertation_jwt_secret_change_in_production
      JWT_EXPIRES_IN: 30d

  frontend:
    build: ./admin-app/frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://backend:3001
